upstream calems_backend {
    server 127.0.0.1:5002;
    keepalive 32;
}

server {
    if ($host = www.caldimproducts.com) {
        return 301 https://caldimproducts.com$request_uri;
    } # managed by Certbot

    if ($host = caldimproducts.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name caldimproducts.com www.caldimproducts.com;
    return 301 https://caldimproducts.com$request_uri;
}

server {
    listen 443 ssl;
    server_name caldimproducts.com www.caldimproducts.com;
    ssl_certificate /etc/letsencrypt/live/caldimproducts.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/caldimproducts.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # --- 1. CALBUY ---
    location /calbuy {
        alias /var/www/Calbuy/frontend/dist/;
        index index.html;
        try_files $uri $uri/ /calbuy/index.html;
    }

    location ^~ /calbuy/api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_set_header Host $host;
    }

    # --- 2. PROJECT MANAGEMENT ---
    location /projectmanagement/ {
        proxy_pass http://127.0.0.1:3004/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /projectmanagement/api/ {
        proxy_pass http://127.0.0.1:5001/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

        # --- CalTIMS Play Store Compliance Pages ---
    location = /caltims/privacy-policy {
        default_type text/html;
        alias /var/www/caltims-compliance/privacy-policy.html;
        add_header Cache-Control "public, max-age=3600";
    }

    location = /caltims/privacy-policy/ {
        return 301 /caltims/privacy-policy;
    }

    location = /caltims/privacy-policy.html {
        return 301 /caltims/privacy-policy;
    }

    location = /caltims/account-deletion {
        default_type text/html;
        alias /var/www/caltims-compliance/account-deletion.html;
        add_header Cache-Control "public, max-age=3600";
    }

    location = /caltims/account-deletion/ {
        return 301 /caltims/account-deletion;
    }

    location = /caltims/account-deletion.html {
        return 301 /caltims/account-deletion;
    }


    # --- CalBudget Mobile App Compliance Pages ---
    location = /calbudget {
        default_type text/html;
        alias /var/www/calbudget/index.html;
        add_header Cache-Control "public, max-age=3600";
    }

    location = /calbudget/ {
        return 301 /calbudget;
    }

    location = /calbudget/privacy {
        default_type text/html;
        alias /var/www/calbudget/privacy.html;
        add_header Cache-Control "public, max-age=3600";
    }

    location = /calbudget/privacy/ {
        return 301 /calbudget/privacy;
    }

    location = /calbudget/privacy.html {
        return 301 /calbudget/privacy;
    }

    location = /calbudget/terms {
        default_type text/html;
        alias /var/www/calbudget/terms.html;
        add_header Cache-Control "public, max-age=3600";
    }

    location = /calbudget/terms/ {
        return 301 /calbudget/terms;
    }

    location = /calbudget/terms.html {
        return 301 /calbudget/terms;
    }

    location = /calbudget/account-deletion {
        default_type text/html;
        alias /var/www/calbudget/account-deletion.html;
        add_header Cache-Control "public, max-age=3600";
    }

    location = /calbudget/account-deletion/ {
        return 301 /calbudget/account-deletion;
    }

    location = /calbudget/account-deletion.html {
        return 301 /calbudget/account-deletion;
    }

    # 1. CalTIMS Frontend (Proxy to Docker)
    location ^~ /caltims/ {
        proxy_pass http://127.0.0.1:3005/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 2. CalTIMS Backend API (Keep this as it is)
    location ^~ /caltims/api/ {
        proxy_pass http://127.0.0.1:5003/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- 4. STEELDMS ---
    location /steel {
        alias /var/www/steel-project/frontend/dist/;
        index index.html;
        try_files $uri $uri/ /steel/index.html;
    }

    location /steel/api/ {
        proxy_pass http://127.0.0.1:5000/api/;
        proxy_set_header Host $host;
    }

    # --- 5. RIMS / CALRIMS ---
    location /calrims {
        proxy_pass http://127.0.0.1:9999;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
    }

    # --- 6. MISC AUTOMATION ---
    location /misc {
        alias /var/www/misc/client/build/;
        index index.html;
        try_files $uri $uri/ /misc/index.html;
    }

    location /misc/api/ {
        rewrite ^/misc/api/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:5010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # --- NEW: SFE Milestone Tracking ---
    location ^~ /SFE {
        alias /var/www/SFE-Milestone-Tracking/frontend/dist;
        try_files $uri $uri/ /SFE/index.html;
    }

    location ^~ /SFE-api/ {
        rewrite ^/SFE-api/(.*)$ /api/$1 break;
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /SFE-static/ {
        alias /var/www/SFE-Milestone-Tracking/backend/static/;
    }

    # --- CalBuyAI ---
    location = /CalBuyAI {
        return 301 /CalBuyAI/;
    }

    location ^~ /CalBuyAI/ {
        alias /var/www/CalBuyAI/frontend/dist/;
        try_files $uri $uri/ /CalBuyAI/index.html;
    }

    location ^~ /CalBuyAI/api/ {
        proxy_pass http://127.0.0.1:8003/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- BLOCK EXPO SERVICE WORKER ---
    location ~* (^/service-worker\.js|^/sw\.js)$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        return 404;
    }

    # --- 7. ROOT & API (EXPO PAGE NEXT.JS) ---
location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_cache_bypass $http_upgrade;
}


    # --- CALMISC AUTOMATION ---
    location ^~ /calmisc {
        alias /var/www/calmisc/client/build/;
        index index.html;
        try_files $uri $uri/ /calmisc/index.html;
    }

    location ^~ /calmisc/api/ {
        rewrite ^/calmisc/api/(.*)$ /api/$1 break;
        proxy_pass http://127.0.0.1:5020;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection upgrade;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Redirect lowercase /tvs to uppercase /Tvs ---
    location /tvs {
        return 301 /Tvs/;
    }

    # --- 8. TVS-PED PRODUCTION APP ---
    location /Tvs {
        alias /var/www/client_tvs_ped/frontend/dist/;
        index index.html;
        try_files $uri $uri/ /Tvs/index.html;
    }

    location ^~ /Tvs/api/ {
        proxy_pass http://127.0.0.1:5050/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /Tvs/uploads/ {
        proxy_pass http://127.0.0.1:5050/uploads/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # ─── Bug-Buddy Frontend ───
    location ^~ /Bug-buddy {
        root /var/www/bugbuddy/frontend;
        index index.html;
        try_files $uri /Bug-buddy/index.html;
    }

    # ─── Bug-Buddy Backend API & Assets Namespace ───
    location /Bug-buddy-api/ {
        rewrite ^/Bug-buddy-api/(.*)$ /$1 break;

        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        client_max_body_size 500M;
    }
    # =========================================================================
    # --- CALTRACK (Port 8002 - avoids conflict with SFE) ---
    # =========================================================================

    # 1. React static assets (JS/CSS chunks from Vite build)
    location /Caltrack/assets/ {
        alias /var/www/Caltrack/frontend_dist/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        gzip_static on;
    }

    # 2. Media uploads (profile photos, etc.)
    location /Caltrack/media/ {
        alias /var/www/Caltrack/media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # 3. Django collected static files (admin, etc.)
    location /Caltrack/static/ {
        alias /var/www/Caltrack/backend/staticfiles/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 4. WebSocket connections (Django Channels / live locations)
    location /Caltrack/ws/ {
        proxy_pass http://127.0.0.1:8002/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
    }

    # 5. Django API (all API requests → Daphne on port 8002)
    location /Caltrack/api/ {
        proxy_pass http://127.0.0.1:8002/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
    }

    # 6. React SPA — catch-all for frontend routing (MUST be last)
    location /Caltrack/ {
        alias /var/www/Caltrack/frontend_dist/;
        try_files $uri $uri/ /Caltrack/index.html;
        # Security headers
        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-Content-Type-Options "nosniff";
    }

    # Redirect /Caltrack (without trailing slash)
    location = /Caltrack {
        return 301 /Caltrack/;
    }

    # =========================================================================
    # --- AI BEAUTY CONSULTANT (Port 8000) ---
    # =========================================================================

    # --- AI Beauty Frontend SPA ---
    location /AI_Beauty {
        alias /var/www/AI_Beauty_Consultant/Frontend/build/;
        index index.html;
        try_files $uri $uri/ /AI_Beauty/index.html;
    }
    location = /AI_Beauty/webhook {
        proxy_pass http://127.0.0.1:8055;
    }



    # --- AI Beauty API Generic Proxy ---
    location /AI_Beauty/api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Route specific endpoints to the Python backend on port 8000 ---
    location = /AI_Beauty/analyze {
        proxy_pass http://127.0.0.1:8000/analyze;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 50M; # Allow large image uploads
    }

    location = /AI_Beauty/history {
        proxy_pass http://127.0.0.1:8000/history;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /AI_Beauty/chat {
        proxy_pass http://127.0.0.1:8000/chat;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # --- Serve uploaded/analyzed images directly via Nginx ---
    location /AI_Beauty/static/ {
        alias /var/www/AI_Beauty_Consultant/Backend/static/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # =========================================================================
    # --- CALSTUD (Port 8004) ---
    # =========================================================================
    location /calstud/ {
        proxy_pass http://127.0.0.1:8004/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Increase Nginx timeouts for heavy OCR PDF processing
        proxy_connect_timeout 300s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
# Map the frontend route to the frontend docker container (running on port 8100)

    # --------------------------------------------------
    # Silence root favicon.ico 502 errors
    # --------------------------------------------------
    location = /favicon.ico {
        log_not_found off;
        access_log off;
        return 204;
    }

    location ^~ /calproject/ {
    proxy_pass http://127.0.0.1:8100/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Map the backend API route to the backend docker container (running on port 8101)
location ^~ /calproject/api/ {
        proxy_redirect http:// $scheme://;
    rewrite ^/calproject/api/(.*)$ /api/$1 break;
    proxy_pass http://127.0.0.1:8101;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    
    # IMPORTANT: Required for WebSockets to work!
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
}

# Map the health check route
location /calproject/healthz {
    proxy_pass http://127.0.0.1:8101/healthz;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
}


    # =========================================================================
    # --- CALEMS (Port 5002) ---
    # =========================================================================

    # 1. CALEMS React Static Assets
    location /calems/assets/ {
        alias /var/www/calems/frontend/dist/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        gzip on;
        gzip_comp_level 6;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript application/wasm;
    }

    # 2. CALEMS Backend API Proxy
    location /calems/api/ {
        proxy_pass http://127.0.0.1:5002/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3. CALEMS WebSockets Engine
        # Root socket.io proxy for CALEMS WebSockets
    location /socket.io/ {
        proxy_pass http://127.0.0.1:5002/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache_bypass $http_upgrade;
        add_header X-Accel-Buffering no;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location ^~ /calems/socket.io/ {
        proxy_pass http://127.0.0.1:5002/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache_bypass $http_upgrade;
        add_header X-Accel-Buffering no;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location = /calems/socket.io {
        proxy_pass http://127.0.0.1:5002/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache_bypass $http_upgrade;
        add_header X-Accel-Buffering no;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # 4. CALEMS React SPA Catch-all
    location /calems/ {
        alias /var/www/calems/frontend/dist/;
        index index.html;
        try_files $uri $uri/ /calems/index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        gzip on;
        gzip_comp_level 6;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript application/wasm;
    }

    # Redirect /calems (without trailing slash)
    location = /calems {
        return 301 /calems/;
    }



    # =========================================================================
    # --- EMS TRANSPORT (Port 5004) ---
    # =========================================================================

    # 1. EMS Transport Static Assets (1 year cache for hashed assets)
    location /transport/assets/ {
        alias /var/www/calems/Ems_transport/frontend/dist/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 2. EMS Transport Frontend SPA (Never cache index.html)
    location /transport/ {
        alias /var/www/calems/Ems_transport/frontend/dist/;
        index index.html;
        try_files $uri $uri/ /transport/index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        gzip on;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    }


    # ─── HUNGERBOX FRONTEND ───────────────────────────────────────────
    location /hungerbox/assets/ {
        alias /var/www/calems/hungerbox/frontend/dist/assets/;
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /hungerbox/ {
        alias /var/www/calems/hungerbox/frontend/dist/;
        index index.html;
        try_files $uri $uri/ @hungerbox_fallback;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    location @hungerbox_fallback {
        root /var/www/calems/hungerbox/frontend/dist;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        try_files /index.html =404;
    }

    location = /hungerbox {
        return 301 /hungerbox/;
    }

    # ─── HUNGERBOX BACKEND API ────────────────────────────────────────
    # ─── HUNGERBOX SOCKET.IO ─────────────────────────────────────────
    location /hungerbox-api/socket.io/ {
        proxy_pass http://127.0.0.1:5006/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    
    # ─── ROOT /api/ & /hungerbox/api/ REVERSE PROXY FOR MOBILE APP ────────────
    location /api/ {
        proxy_pass http://127.0.0.1:5006/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
    }

    location /hungerbox/api/ {
        proxy_pass http://127.0.0.1:5006/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
    }

    location /hungerbox-api/ {
        proxy_pass http://127.0.0.1:5006/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
    }
    # ─────────────────────────────────────────────────────────────────


        # ─── ALUMNI PORTAL FRONTEND ───────────────────────────────────────
    location /Aluminiprotal/assets/ {
        alias /var/www/calems/alumni-frontend/dist/assets/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /Aluminiprotal/api/ {
        proxy_pass http://127.0.0.1:5002/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    location /Aluminiprotal/ {
        alias /var/www/calems/alumni-frontend/dist/;
        index index.html;
        try_files $uri $uri/ /Aluminiprotal/index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    location = /Aluminiprotal {
        return 301 /Aluminiprotal/;
    }

    location /aluminiprotal/ {
        return 301 /Aluminiprotal/;
    }
    location = /aluminiprotal {
        return 301 /Aluminiprotal/;
    }
    location /alumniportal/ {
        return 301 /Aluminiprotal/;
    }
    location = /alumniportal {
        return 301 /Aluminiprotal/;
    }
    location /alumni/ {
        return 301 /Aluminiprotal/;
    }
    location = /alumni {
        return 301 /Aluminiprotal/;
    }
    # ─────────────────────────────────────────────────────────────────

    # Redirect /transport
    location = /transport {
        return 301 /transport/;
    }

    # 3. EMS Transport Backend API (Port 5004)
    location /transport-api/ {
