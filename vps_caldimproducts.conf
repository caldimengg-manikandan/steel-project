        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # =========================================================================
    # --- DAS MANAGEMENT (Port 5005) ---
    # =========================================================================

    location /dasmanagement/assets/ {
        alias /var/www/DASmanagement/frontend/dist/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /dasmanagement/api/ {
        proxy_pass http://127.0.0.1:5005/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    location /dasmanagement/ {
        alias /var/www/DASmanagement/frontend/dist/;
        index index.html;
        try_files $uri $uri/ /dasmanagement/index.html;
