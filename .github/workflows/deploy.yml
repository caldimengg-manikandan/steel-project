name: Deploy to VPS

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: GITHUB_TOKEN
          script: |
             export NVM_DIR="$HOME/.nvm"
             [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"

             cd /var/www/steel-project && echo "=== CD successful ==="
             git reset --hard && echo "=== Git reset successful ==="
             
             # Use GITHUB_TOKEN for authentication if origin uses HTTPS
             git pull https://x-access-token:$GITHUB_TOKEN@github.com/${{ github.repository }}.git main && echo "=== Git pull successful ==="
             
             # ── Update Backend ──────────────────────────────────────
             cd backend && echo "=== CD backend successful ==="
             npm install && echo "=== NPM install backend successful ==="
             pm2 delete all || true
             pm2 start src/app.js --name steel-dms --node-args="--max-old-space-size=2048" --max-memory-restart 2048M && echo "=== PM2 action completed ==="
             
              # ── Update Frontend ─────────────────────────────────────
              cd ../frontend && echo "=== CD frontend successful ==="
              npm install && echo "=== NPM install frontend successful ==="
              export NODE_OPTIONS="--max-old-space-size=1024"
              npm run build && echo "=== Frontend build successful ==="
             # If using PM2 to serve frontend, restart it here too.
             # Nginx will automatically pick up the new files in the 'dist' folder.
