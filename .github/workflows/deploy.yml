name: Deploy to VPS

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: GITHUB_TOKEN
          script: |
             export NVM_DIR="$HOME/.nvm"
             [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"

             cd /var/www/steel-project && echo "=== CD successful ==="
             git reset --hard && echo "=== Git reset successful ==="
             
             # Use GITHUB_TOKEN for authentication if origin uses HTTPS
             git pull https://x-access-token:$GITHUB_TOKEN@github.com/${{ github.repository }}.git main && echo "=== Git pull successful ==="
             
             # ── Update Backend & Python AI Environment ──────────────
             cd backend && echo "=== CD backend successful ==="
             npm install && echo "=== NPM install backend successful ==="

             # Ensure Python virtual environment and AI dependencies exist
             cd AiExtraction && echo "=== Setting up Python AI .venv ==="
             if [ ! -d ".venv" ]; then
                 python3 -m venv .venv && echo "=== Virtualenv created ==="
             fi
             .venv/bin/pip install --upgrade pip setuptools wheel || true
             if [ -f "requirements.txt" ]; then
                 .venv/bin/pip install -r requirements.txt && echo "=== Python dependencies installed ==="
             fi
             cd ..

             pm2 delete all || true
             pm2 start src/app.js --name steel-dms --node-args="--max-old-space-size=2048" --max-memory-restart 2048M && echo "=== PM2 action completed ==="
             
              # ── Update Frontend ─────────────────────────────────────
              cd ../frontend && echo "=== CD frontend successful ==="
              npm install && echo "=== NPM install frontend successful ==="
              export NODE_OPTIONS="--max-old-space-size=1024"
              npm run build && echo "=== Frontend build successful ==="
             # If using PM2 to serve frontend, restart it here too.
             # Nginx will automatically pick up the new files in the 'dist' folder.

      - name: VPS Diagnostics & Logs
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
             export NVM_DIR="$HOME/.nvm"
             [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"

             echo "=========================================="
             echo "🔍 1. DEPLOYED COMMIT VERIFICATION"
             echo "=========================================="
             git -C /var/www/steel-project log -1

             echo "=========================================="
             echo "🧠 2. SYSTEM MEMORY (free -h)"
             echo "=========================================="
             free -h

             echo "=========================================="
             echo "🐍 3. AI EXTRACTION VENV & PYTHON CHECK"
             echo "=========================================="
             ls -la /var/www/steel-project/backend/AiExtraction/ || true
             if [ -f "/var/www/steel-project/backend/AiExtraction/.venv/bin/python" ]; then
                 echo "✓ Python .venv binary exists!"
                 /var/www/steel-project/backend/AiExtraction/.venv/bin/python --version || true
             else
                 echo "✗ Warning: .venv/bin/python NOT found!"
             fi

             echo "=========================================="
             echo "⚙️ 4. PM2 STATUS & PROCESS SHOW"
             echo "=========================================="
             pm2 status
             pm2 show steel-dms || true

             echo "=========================================="
             echo "🌐 5. NGINX CLIENT MAX BODY SIZE"
             echo "=========================================="
             grep -rn "client_max_body_size" /etc/nginx/ || echo "client_max_body_size is UNSET in Nginx (default 1M)"

             echo "=========================================="
             echo "📜 6. PM2 RECENT LOGS (steel-dms)"
             echo "=========================================="
             pm2 logs steel-dms --lines 100 --nostream || true

             echo "=========================================="
             echo "🚨 7. NGINX RECENT ERROR LOGS"
             echo "=========================================="
             sudo tail -n 50 /var/log/nginx/error.log || true
