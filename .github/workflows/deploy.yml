name: Deploy to VPS

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: GITHUB_TOKEN
          script: |
             export NVM_DIR="$HOME/.nvm"
             [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"

             cd /var/www/steel-project && echo "=== CD successful ==="
             git fetch https://x-access-token:$GITHUB_TOKEN@github.com/${{ github.repository }}.git main && echo "=== Git fetch successful ==="
             git reset --hard FETCH_HEAD && echo "=== Git reset to FETCH_HEAD successful ==="
             git clean -fd && echo "=== Git clean successful ==="
             
             # ── Update Backend ──────────────────────────────────────
             cd backend && echo "=== CD backend successful ==="
             npm install && echo "=== NPM install backend successful ==="
             pm2 delete all || true
             pm2 start src/app.js --name steel-dms && echo "=== PM2 action completed ==="
             
              # ── Update Frontend ─────────────────────────────────────
              cd ../frontend && echo "=== CD frontend successful ==="
              npm install && echo "=== NPM install frontend successful ==="
              export NODE_OPTIONS="--max-old-space-size=2048"
              npm run build && echo "=== Frontend build successful ==="
              mkdir -p /var/www/steel-project/dist /var/www/html
              cp -rf dist/* /var/www/steel-project/dist/ 2>/dev/null || true
              cp -rf dist/* /var/www/html/ 2>/dev/null || true
              sudo systemctl reload nginx 2>/dev/null || sudo nginx -s reload 2>/dev/null || true
              echo "=== Deployment completed successfully ==="
