name: Deploy to VPS

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
             cd /var/www/steel-project
             git reset --hard
             git pull origin main
             
             # ── Update Backend ──────────────────────────────────────
             cd backend
             npm install
             # Restart the PM2 process (assumes the name is 'steel-dms')
             pm2 restart steel-dms || pm2 start src/app.js --name steel-dms
             
             # ── Update Frontend ─────────────────────────────────────
             cd ../frontend
             npm install
             npm run build
             # If using PM2 to serve frontend, restart it here too.
             # Nginx will automatically pick up the new files in the 'dist' folder.
