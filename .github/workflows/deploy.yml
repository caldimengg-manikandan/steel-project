name: Deploy to VPS

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: GITHUB_TOKEN
          script: |
             export PATH=$PATH:/usr/local/bin:$HOME/.nvm/versions/node/$(ls $HOME/.nvm/versions/node 2>/dev/null | tail -n 1)/bin
             export NVM_DIR="$HOME/.nvm"
             [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"

             cd /var/www/steel-project
             git fetch origin main
             git reset --hard origin/main && echo "=== Git reset successful ==="

             # ── Update Backend ──────────────────────────────────────
             cd /var/www/steel-project/backend
             npm install && echo "=== NPM install backend successful ==="

             # Ensure Python virtual environment exists
             if [ ! -d "AiExtraction/.venv" ]; then
                 mkdir -p AiExtraction
                 python3 -m venv AiExtraction/.venv || true
                 if [ -f "AiExtraction/.venv/bin/pip" ]; then
                     AiExtraction/.venv/bin/pip install PyMuPDF pdfplumber pandas openpyxl || true
                 fi
             fi

             pm2 restart steel-dms --update-env || pm2 start src/app.js --name steel-dms && echo "=== PM2 restart completed ==="

             # ── Update Frontend ─────────────────────────────────────
             cd /var/www/steel-project/frontend
             npm install && echo "=== NPM install frontend successful ==="
             export NODE_OPTIONS="--max-old-space-size=1024"
             npm run build && echo "=== Frontend build successful ==="

             # ── Reload Nginx ────────────────────────────────────────
             sudo systemctl reload nginx && echo "=== Nginx reloaded successfully ==="

